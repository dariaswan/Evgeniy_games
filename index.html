<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evgeniy’s English Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4EEE7; --bg-dot:#CFE0D5; --ink:#1D2320; --muted:#56635D;
  --panel:#FFFFFF; --line:#D3DCD6; --cab:#6B1424; --cab-2:#430A16; --brass:#D4A72C;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1D17; --bg-dot:#16302A; --ink:#ECEFEA; --muted:#A3B0AA;
    --panel:#162720; --line:#2A3F35; --cab:#5A0F1E; --cab-2:#33070F; color-scheme:dark;
  }
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--bg-dot) 1.2px,transparent 1.4px);background-size:18px 18px;color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
.wrap{max-width:900px;margin:0 auto;padding:28px 16px 48px}
header{background:linear-gradient(180deg,var(--cab),var(--cab-2));border:5px solid var(--brass);border-radius:24px;padding:26px 24px;text-align:center;color:#F3DDB0}
h1{font-family:Bungee,Impact,"Arial Black",sans-serif;font-weight:400;color:var(--brass);font-size:clamp(24px,5vw,40px);margin:0;line-height:1.1;text-shadow:0 3px 0 #1E0308}
header p{margin:8px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:24px}
.game{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:20px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
a.game:hover{border-color:var(--brass);transform:translateY(-3px)}
a.game:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.emoji{font-size:40px;line-height:1}
.game h2{font-size:20px;margin:6px 0 0}
.game p{margin:0;color:var(--muted);font-size:15px}
.tag{align-self:flex-start;margin-top:8px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--brass);color:#2A0710}
.soon{opacity:.55;border-style:dashed}
.soon .tag{background:var(--line);color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Evgeniy’s English Games</h1>
    <p>Choose a game and play. GL HF!</p>
  </header>
  <main class="grid" id="games"></main>
</div>
<script>
/* To add a game: upload the HTML file, then add one line below.
   file: the exact file name. Leave file empty ("") for "coming soon". */
const GAMES = [
  {emoji:"🎰", title:"Tony’s Tense Casino", text:"Spin the reels and make sentences in 4 tenses.", tag:"Tenses", file:"tense-casino.html"},
  {emoji:"🕵️", title:"Heist Pixel Detective", text:"Solve the case of the Pink Diamond.", tag:"The Heist", file:"heist-pixel-detective.html"},
  {emoji:"⚡", title:"Irregular Verbs", text:"Practise go – went, take – took and more.", tag:"Past simple", file:"irregular-verbs-game.html"},
  {emoji:"✈️", title:"George: Catch the Flight", text:"Help George get to his plane on time.", tag:"Travel", file:"george_catch_the_flight.html"},
  {emoji:"🎮", title:"Coming soon", text:"A new game is on the way.", tag:"Soon", file:""}
];
document.getElementById("games").innerHTML = GAMES.map(g => g.file
  ? `<a class="game" href="${g.file}"><span class="emoji">${g.emoji}</span><h2>${g.title}</h2><p>${g.text}</p><span class="tag">${g.tag}</span></a>`
  : `<div class="game soon"><span class="emoji">${g.emoji}</span><h2>${g.title}</h2><p>${g.text}</p><span class="tag">${g.tag}</span></div>`
).join("");
</script>
</body>
</html>
